# registry.yml — machine-readable project registry for the portfolio-prompts library
#
# This is the **source of truth** for the project registry. The README.md registry table is
# GENERATED from this file by `tools/render-registry.py` (PP-23) — do not hand-edit the table
# between its `<!-- REGISTRY:START -->`/`<!-- REGISTRY:END -->` markers; edit this file and re-run
# the generator. Tooling and skills load this file directly instead of parsing the README prose.
#
# Precedence, exactly as project-layout.md describes: a project's `deviations:` override the
# `defaults:` below; recorded deviations are still full onboarding, not "not onboarded".
#
# Field notes for the generator (tools/render-registry.py):
# - `status_label` (optional) overrides the displayed Status cell; otherwise it is derived from
#   `status` (`active`, `resting`, or `meta`; `product` adds the product qualifier).
# - Lifecycle and orchestration eligibility are independent. `resting` means the canonical backlog
#   has zero outstanding items; it does not remove a project from safe fan-outs.
# - `presentation_role` is required on every project row and is independent of both lifecycle and
#   orchestration. Allowed values: `showcase`, `methodology`, `hidden`.
# - The Notes cell is composed as: `notes` prose, then a rendered "Gates:" clause, then
#   "Deviations:" and "Depends on:" clauses. So keep `notes` free of gate/deviation/coupling text
#   (those are structured below and rendered automatically) — put only framing, URLs, handover
#   refs, and caveats in `notes`.
#
# House style: en-GB, ASCII, two-space indent. `{project}` interpolates the row's `project`.

version: 1
portfolio_root: test-automation-portfolio   # folder that holds the individual project checkouts

# ---------------------------------------------------------------------------
# Defaults — applied to every project unless a row's `deviations:` overrides one.
# Mirrors project-layout.md so the paths live in exactly one place.
# ---------------------------------------------------------------------------
defaults:
  backlog: docs/backlog.md
  implementation_logs: docs/implementation-logs/
  reviews: .review/
  adr: docs/adr/
  project_contract: docs/project-contract.md   # optional per project; first gate source if present

  handovers: session-notes/                     # paired files tracked by the portfolio root repo
  worklist: WORKLIST_{project}.md               # tracked control state in the portfolio root repo
  shared_templates: templates/

  gate_cascade:                                 # first-hit-wins; mirrors project-layout.md
    - project_contract
    - registry_gates
    - npm_run_verify
    - stack_defaults
    - ask

# ---------------------------------------------------------------------------
# Projects — one row per registry member, in README order. `project` is the PROJECT= value.
# ---------------------------------------------------------------------------
projects:
  - project: magento-checkout-automation
    github: GBrooks1970/magento-checkout-automation
    status: resting
    status_label: "Closed 2026-08-03"
    presentation_role: showcase
    reference: true
    gates: ["npm run verify"]
    orchestration_target: true
    notes: >-
      Closed 2026-08-03 (terminal handover v22 FINAL). Reference project with zero outstanding backlog
      items — all Items #1..#15 delivered, and both post-close review-derived worklist cycles complete
      (CODEX-01..CODEX-11 + SEC-01). Remains a resting orchestration target per the library contract, so
      the `*-all-*` fan-outs may still review it; treat any new findings as a deliberate reopen. Chromium
      is the required CI gate; Firefox/WebKit stay non-blocking with an observable promotion counter
      (tracker in `docs/qa-strategy.md`, currently Firefox 0/3, WebKit 0/3; each exploratory CI leg prints
      a `MAG-15 promotion` summary line). Latest handover v22 in `session-notes/`; optional proposals in
      `docs/planning/`.

  - project: hand-baked-screenplay-pattern
    github: NeoCognitus70/hand-baked-screenplay-pattern
    status: active
    presentation_role: showcase
    gates: ["npm run verify"]
    orchestration_target: true
    notes: >-
      Active provider-first iteration. Provider-switching Phases 0-1 were promoted on 2026-08-16 as
      six required MEDIUM backlog items, HBSP-28..33, executed in dependency order. Calculator Phase 2
      and later portfolio migrations remain unpromoted in their owning projects.

  - project: calculator-screenplay-bdd
    github: NeoCognitus70/calculator-screenplay-bdd
    status: resting
    presentation_role: showcase
    gates: ["npm run verify"]
    orchestration_target: true
    couples_with:
      project: hand-baked-screenplay-pattern
      reason: prepare:screenplay installs and builds inside the sibling checkout
      order: provider-first
    notes: Stable consumer example with zero required backlog items.

  - project: gb.automation.smoketests.sudoku.poc
    github: GBrooks1970/gb.automation.smoketests.sudoku.poc
    status: active
    presentation_role: showcase
    multi_stack: true
    orchestration_target: true
    deviations:
      backlog: DOCS/.planning/backlog.md
      implementation_logs: DOCS/.implementation-logs/
      reviews: DOCS/.review/
      shared_templates: DOCS/.templates/
    gates:
      type: ci_jobs
      stacks:
        - { name: demoapp001, tool: cypress, language: typescript }
        - { name: demoapp002, tool: pytest,  language: python }
        - { name: demoapp003, tool: specflow, language: csharp }
      parity_scripts: .batch/*.ps1
    notes: >-
      Multi-stack POC with its own doc system; run stack defaults inside the touched stack's
      directory, never at the repo root.

  - project: bfx-ws-screenplay
    github: GBrooks1970/bfx-ws-screenplay
    status: active
    presentation_role: showcase
    sdd: true
    orchestration_target: true
    gates: ["npm run typecheck", "npm run lint", "npm run test:smoke"]
    live_api:
      endpoint: Bitfinex public WebSocket API v2
      blocked_outcome_is_failure: false
      extended_tag_schedule: nightly
    notes: >-
      In-repo `SPECIFICATION.md` is normative (SDD) — one SPEC unit at a time; feature file reviewed
      before framework code; deviations need an ADR change note. `test:smoke` hits the live public
      API; `environment-blocked` outcomes are platform maintenance, not failures; `@extended` runs
      nightly only.

  - project: orangehrm-pim-automation
    github: GBrooks1970/orangehrm-pim-automation
    status: resting
    presentation_role: showcase
    orchestration_target: true
    gates:
      type: ci
      static: ["npx tsc --noEmit"]
      e2e:
        bring_up: docker compose up -d --wait
        run: npm test
      notes: CI (Node 20) also builds Serenity living docs and deploys Pages
    notes: >-
      OrangeHRM PIM add-employee E2E (Serenity/JS + Playwright + Cucumber). Backlog is a simple
      table (not the scored template). All six backlog items are closed; Item #4 retains an
      accepted demo-fixture caveat but no required follow-up. Live docs:
      gbrooks1970.github.io/orangehrm-pim-automation.

  - project: markdown-renderer
    github: GBrooks1970/markdown-renderer
    status: resting
    presentation_role: showcase
    product: true
    orchestration_target: true
    gates: ["npm run verify"]
    notes: >-
      A shipped product, not a Screenplay test suite: a static, offline, browser-based Markdown
      viewer with its own suite. Currently 0 outstanding (FR-1..FR-11 shipped and live), so a derive
      honestly returns nothing actionable. Treat its tests as the product's own suite, not portfolio
      Screenplay conventions. Live demo: gbrooks1970.github.io/markdown-renderer/.

  - project: mobile-forex-automation
    github: GBrooks1970/mobile-forex-automation
    status: resting
    presentation_role: showcase
    orchestration_target: true
    gates: ["npm run verify"]
    notes: >-
      Mobile-web test-automation showcase: a deterministic forex demo SUT with Playwright Pixel and
      iPhone emulation, Screenplay journeys, and a Vitest-tested P&L core. The MF-01..MF-14 roadmap
      is complete with zero required backlog items. Live demo:
      gbrooks1970.github.io/mobile-forex-automation/.

  - project: parabank-bank-automation
    github: GBrooks1970/parabank-bank-automation
    status: active
    presentation_role: showcase
    orchestration_target: true
    gates:
      type: ci
      static: ["npm run typecheck"]
      e2e:
        bring_up: pwsh ./scripts/build-sut.ps1; docker compose up -d; pwsh ./scripts/gate.ps1
        run: npm run verify
      notes: >-
        docs/project-contract.md is the first-hit gate source. npm run verify runs both lanes
        + smoke-safety + the Serenity report content check (needs Playwright Chromium and a JDK,
        both installed in CI); the boot gate precedes verify.
    notes: >-
      Ninth portfolio project. ParaBank (Parasoft, Apache-2.0) as a pinned, Docker-backed
      banking SUT (never committed here; fetched at build). Two lanes: Serenity/JS + Playwright +
      Cucumber UI journeys (A1-A5) and API-first stateful BDD with a portfolio-first REST-SOAP
      parity check (B1-B4); the current baseline is 14 API and 8 UI scenarios plus 17
      SUT-independent unit tests. Phased delivery PB-P0..P5 and PB-CODEX-01..10 review remediation
      are complete; the project remains active for LOW risk maintenance in docs/backlog.md v19.
      PBR-03 is immediately actionable; PBR-01, PBR-02, PBR-04, and PBR-05 are trigger-gated.
      Decisions are in docs/decision-register.md (DR-PB-01..10); latest handover is v4 in
      session-notes/.

  - project: juice-shop-dast-automation
    github: GBrooks1970/juice-shop-dast-automation
    status: active
    presentation_role: showcase
    orchestration_target: true
    gates:
      type: ci
      static: ["npm run verify"]
      notes: >-
        npm run verify (typecheck + 21 unit tests) is Docker-free and is the orchestration-safe
        gate. The ZAP scan (npm run dast) and the BDD exploit confirmations (npm run bdd) are
        self-contained -- each boots the pinned Juice Shop container and tears it down -- and run
        in CI (.github/workflows/ci.yml), not in verify. The pass/fail signal is npm run
        scan:verdict (which parses report.json), not zap-baseline.py's exit code, which is always
        non-zero on this deliberately-vulnerable target.
    notes: >-
      Eleventh portfolio project, and the portfolio's first security lane. A DAST showcase: an
      OWASP ZAP passive baseline scan plus BDD exploit-confirmation scenarios against a pinned,
      intentionally-vulnerable OWASP Juice Shop 20.1.1 (MIT) training target -- not a real
      product; its findings are expected and every surface is labelled as such. The
      positive-detection gate asserts the expected security-misconfiguration and
      information-disclosure classes (a passive baseline detects no injection classes), while the
      three BDD scenarios (SQL-injection login bypass, sensitive-file exposure, and IDOR) supply
      the active-exploitation proof a passive scan cannot. Design and decisions D2.1a-D2.7a are in
      docs/dast-lane-design.md; images are digest-pinned (Juice Shop 20.1.1, OWASP ZAP 2.17.0) and
      a pin bump re-triggers the Phase 0 probe (backlog DAST-M1). Phases 0-4 are complete and the
      labelled report is published at https://gbrooks1970.github.io/juice-shop-dast-automation/.

  - project: auth-separation
    github: GBrooks1970/auth-separation
    status: active
    presentation_role: methodology
    sdd: true
    orchestration_target: true
    gates: ["npm run verify"]
    notes: >-
      Twelfth portfolio project and the portfolio's Specification Driven Development exemplar: a
      complete, technology-agnostic spec set for separating authentication (AuthN, PCI scope),
      authorisation (AuthZ, SOC 2 scope) and user information (GDPR scope) into three independent
      services, with a separated decision audit store. Contracts only -- three OpenAPI 3.1 documents,
      an AsyncAPI 3.0 event contract, Gherkin acceptance criteria in `features/`, three compliance
      documents, a database spec and a deployment-topology design doc. **Nothing is implemented**, and
      the first commit is the spec set alone, so the repository itself is the evidence that
      specification preceded code. Read `auth-separation_architecture_v1.md` before the three API
      specs; without it they read as three unrelated documents. Cross-service state travels only via
      the AsyncAPI events and there is no shared database -- both are spec constraints, not
      preferences, and generated stubs are never hand-edited. The plan of record is
      `auth-separation_implementation-kanban_v1.html`, a phased board of 51 AUTH-nnn tickets that opens
      offline; `docs/backlog.md` owns ticket status while the Kanban owns ticket content. Definition of
      done is the README's 10-item production-readiness checklist.

  - project: portfolio-prompts
    github: NeoCognitus70/portfolio-prompts
    status: meta
    presentation_role: methodology
    orchestration_target: false
    single_project_prompts_ok: true
    deviations:
      backlog: portfolio-prompts/docs/backlog.md
    gates: ["python tools/check-library.py"]   # PP-15 self-gate (docs-only; no build)
    notes: >-
      The prompt library itself. Single-project prompts (`resume-session`, `derive-worklist`,
      `loop-worklist`, `write-implementation-log`, `write-code-review`) may target
      `PROJECT=portfolio-prompts`. Not a target of the orchestration fan-outs.

# ---------------------------------------------------------------------------
# Support repositories are deliberately outside the PROJECT registry and orchestration fan-outs.
# `tools/check-library.py` still treats their workspace folders as classified and validates that
# they cannot accidentally become orchestration targets.
# ---------------------------------------------------------------------------
support_repositories:
  - folder: portfolio-landing
    github: GBrooks1970/portfolio
    role: public presentation
    status: active
    orchestration_target: false
    notes: Public landing page for the portfolio; support surface, not a test-automation target.
