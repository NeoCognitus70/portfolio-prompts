# ---------------------------------------------------------------------------
# Docker record. A project row's optional `docker:` block declares what that project needs in the
# local Docker engine: `compose` files (relative to the project, in `-f` order), `compose_env` for
# variables the files require, `compose_project` when Docker's derived name differs,
# `dockerfiles` whose FROM images count as the project's, script-run `images` (`ref`, `purpose`,
# `source` file that pins the ref) and named `volumes` created outside Compose.
# `docker_external` claims Docker objects owned by work outside the portfolio, so the inventory
# does not report them as orphans. `tools/docker_inventory.py` reads both, read-only, and writes
# the snapshot in portfolio-docs/PORTFOLIO_DOCKER_INVENTORY.md.
# ---------------------------------------------------------------------------
docker_external:
  - name: sdet-tech-test-rehearsal-suite
    location: D:\gb-dev (NeoCognitus70/sdet-tech-test-rehearsal-suite)
    compose_projects: [tech-test-proj-08, tech-test-proj-08-solution]
    images: ["parabank:d1bf006"]
    notes: >-
      Practice Project 08 runs ParaBank as `parabank-proj08` on port 3007, reusing the image built by
      parabank-bank-automation. Stop it with `npm run sut:stop` in the project folder.
