name: Prompt library integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: library-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check-library
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install gate dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Run prompt-library self-gate
        run: python tools/check-library.py
