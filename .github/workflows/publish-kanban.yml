name: Publish kanban generator

# Publishes tools/kanban (portfolio-kanban-generator) to the public npm registry
# when a tag of the form `kanban-v<version>` is pushed. The tag version must match
# the version in tools/kanban/package.json, and the generator's own Node test suite
# must pass, before anything is published.
#
# Requires a repository secret NPM_TOKEN — an npm automation/publish token for an
# account that owns the `portfolio-kanban-generator` name.

on:
  push:
    tags:
      - "kanban-v*"

permissions:
  contents: read

concurrency:
  group: publish-kanban-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/kanban

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package version
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#kanban-v}"
          echo "package.json: $pkg_version   tag: $tag_version"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Run generator test suite
        run: node --test

      - name: Publish (public)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
